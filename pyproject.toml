[project]
name = "bot-bros"
version = "0.5.0"
description = "A crew of Claude Code plugins and one CLI that keep agent-written code honest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bros = "bros.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bros"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/bouncer/hooks" = "bros/_hooks"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
